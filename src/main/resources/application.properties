spring.application.name=JobTracker

# Datasource Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Job_Info?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=${JWT_SECRET}
# Expiration time in milliseconds (e.g., 24 hours = 86400000 ms)
jwt.expiration=86400000
logging.level.org.springframework.security=INFO